<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codetist DAP Starter</title>
    <style>
      :root { color-scheme: dark; font: 13px system-ui, sans-serif; }
      body { margin: 0; padding: 20px; color: #d4d4d4; background: #1e1e1e; }
      h1 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
      p { color: #a0a0a0; line-height: 1.5; }
      button { padding: 6px 10px; border: 1px solid #555; background: #252526; color: inherit; cursor: pointer; }
      button:hover { background: #333; }
      pre { min-height: 180px; padding: 12px; overflow: auto; border: 1px solid #383838; background: #181818; white-space: pre-wrap; }
      #context { color: #9da7b3; }
    </style>
  </head>
  <body>
    <h1>Codetist DAP Starter</h1>
    <p id="context">Loading project context…</p>
    <button id="start">Start sample debug session</button>
    <button id="stop" disabled>Stop</button>
    <pre id="log" aria-live="polite"></pre>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
